name: Validate and package
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: node tests/test_apex_mock.js
      - run: node tests/test_coordinator.js
      - run: node --check extension/background.js
      - run: node --check extension/station.js
      - name: Validate Windows APIs and installer syntax
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $errors = $null
          [System.Management.Automation.Language.Parser]::ParseFile("$PWD/setup.ps1", [ref]$null, [ref]$errors) | Out-Null
          if ($errors.Count) { throw ($errors | Out-String) }
          python -c "import sys;sys.path.insert(0,'app');import scanners;print('HID keyboards:',len(scanners.devices()))"
  release:
    needs: test
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - run: python tools/package.py
      - uses: actions/upload-artifact@v4
        with:
          name: non-inventory-2.0.0
          path: dist/*
      - name: Publish versioned release once
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if ! gh release view v2.0.0 >/dev/null 2>&1; then
            gh release create v2.0.0 dist/* --target "$GITHUB_SHA" --title 'Non-Inventory 2.0.0' --notes-file docs/RELEASE.md
          fi
